<!--
....
..Enlaces

....Los.enlaces.nos.permiten.crear.navegación.interna.y.externas.html.

....Sintaxis:

....<a>...</a>

Sintaxis:
<a href="...">...</a>

El atributo "href" indica la dirección del enlace. Puede ser una dirección interna (otra página del mismo sitio) o externa (una página de otro sitio).

-URL externa
-La ruta (path) de un archivo html
-El ID de un elemento HTML

El atributo "target" le indica al enlace que se debe abrir en una pstaña nueva cuando usamos el "valor _Blank"

El atributo "id" nos permite identificar un elemento HTML para poder enlazarlo desde otro lugar.

El atributo "name" nos permite identificar un elemento HTML para poder enlazarlo desde otro lugar.


-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><link rel="stylesheet" href=""></title>
</head>
<body>
    <a href="https://www.tiktok.com" target="_blank">Esto es un enlace externo</a>
    <br>
    <a href="05-Enlaces.HTML">Esto es un enlace a otro documento interno</a>
    <br>
    <a href="#X">Este es un enlace hacia un elemento HTML</a>
    <br>
    <a href="#"> Esto es un enlace muerto </a>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>

    <h2 id="X">Elemento para enlazar</h2>
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>
</html>
